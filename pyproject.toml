[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "house-agent"
version = "0.1.0"
description = "Friday: a private, self-hosted home assistant. Local AI, voice, TVs, lights and more."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "knightlie-code" }]
keywords = ["home-assistant", "voice-assistant", "local-llm", "self-hosted", "smart-home", "privacy", "ollama", "matter", "zigbee", "roku"]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
  "av>=13,<19",
  "numpy>=1.26,<3",
  "sherpa-onnx>=1.10,<2",
  "websockets>=13,<16",
  "aiomqtt>=2,<3",
  # Calendar subscriptions (Google secret address, iCloud share links).
  "icalendar>=6,<7",
  "recurring-ical-events>=3,<4",
  # Television control, one library per platform. All speak to the TV over
  # the LAN; none needs an account, an API key, or a cloud service.
  "aiowebostv>=0.10,<1",       # LG webOS
  "samsungtvws>=3,<4",         # Samsung Tizen
  "pyvizio>=0.1.60,<1",        # Vizio SmartCast
  "androidtvremote2>=0.3,<1",  # Android TV / Google TV
  "adb-shell[async]>=0.4,<1",  # Amazon Fire TV (ADB)
  "pyatv>=0.16,<1",            # Apple TV
  "zeroconf>=0.130,<1",        # mDNS discovery for the above
  # Only used when the household picks Anthropic in Settings.
  "anthropic>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.urls]
Homepage = "https://github.com/knightlie-code/friday"
Issues = "https://github.com/knightlie-code/friday/issues"

[project.scripts]
house-agent = "house_agent.api:run"
roku-cli = "house_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/house_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
